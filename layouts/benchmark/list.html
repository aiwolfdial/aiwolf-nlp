{{- define "main" }}
{{- /* ベンチマークタブのトップ: 説明文と、エージェント / ジャッジ のカード */}}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}
  <div class="post-description">{{ . | markdownify }}</div>
  {{- end }}
</header>
{{- with .Content }}
<div class="post-content">{{ . }}</div>
{{- end }}
{{- range .RegularPages.ByWeight }}
<article class="post-entry">
  <header class="entry-header"><h2 class="entry-hint-parent">{{ .Title }}</h2></header>
  <div class="entry-content"><p>{{ .Description }}</p></div>
  <a class="entry-link" aria-label="post link to {{ .Title | plainify }}" href="{{ .Permalink }}"></a>
</article>
{{- end }}
{{- end }}{{/* end main */}}
