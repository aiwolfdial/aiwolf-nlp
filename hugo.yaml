baseURL: https://aiwolfdial.github.io/aiwolf-nlp/
theme: ["PaperMod"]
enableRobotsTXT: true
enableGitInfo: true

params:
  env: production
  description: "人狼知能大会 自然言語部門（AIWolfDial）の公式サイト。マルチエージェント対話によるAI人狼ゲームの研究・大会情報を掲載しています。"
  socialIcons:
    - name: "x"
      url: https://x.com/aiwolfdial_nlp
    - name: "github"
      url: https://github.com/aiwolfdial

defaultContentLanguage: ja
mainSections:
  - page

languages:
  ja:
    languageName: "日本語"
    title: 人狼知能大会 自然言語部門
    weight: 1
    taxonomies:
      category: カテゴリ
      tag: タグ
      series: シリーズ
    menu:
      # main はサイト全体のメニュー（トップページ・results・organizer など大会に属さないページで表示）
      # 大会ページを開いたときは、その大会のメニューに切り替わる
      # （メニュー名は content/menu/ のディレクトリ名を小文字にし、末尾の _en を除いたもの。
      #   大会トップページ content/page/*.md には front matter で menu_id: <メニュー名> を書く）
      main:
        - name: "大会情報"
          url: /
          weight: 1
        - name: "結果・ログ"
          url: /results/
          weight: 2
        - name: "論文"
          url: /papers/
          weight: 3
        - name: "リンク"
