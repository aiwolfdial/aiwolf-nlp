baseURL: https://aiwolfdial.github.io/aiwolf-nlp/
theme: ["PaperMod"]
enableRobotsTXT: true
enableGitInfo: true

# 大会データ (aiwolf-nlp-contests) を submodule external/ から data/ にマウントする。
# module.mounts を書くと既定のマウントが無効になるので、標準ディレクトリも列挙している。
module:
  mounts:
    - {source: content,   target: content}
    - {source: layouts,   target: layouts}
    - {source: static,    target: static}
    - {source: assets,    target: assets}
    - {source: data,      target: data}
    - {source: i18n,      target: i18n}
    - {source: archetypes, target: archetypes}
    - {source: external/aiwolf-nlp-contests/contests, target: data/contests}
    - {source: external/aiwolf-nlp-contests/roles,    target: data/roles}

params:
  env: production
  description: "人狼知能大会 自然言語部門（AIWolfDial）の公式サイト。マルチエージェント対話によるAI人狼ゲームの研究・大会情報を掲載しています。"
  socialIcons:
    - name: "x"
      url: https://x.com/aiwolfdial_nlp
    - name: "github"
      url: https://github.com/aiwolfdial

defaultContentLanguage: ja
mainSections:
  - page

languages:
